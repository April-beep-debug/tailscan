<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TailScan - Iniciar Sesión</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
</head>
<body>
    <main>
        <div class="login-container">
            
            <!-- Logo / Icono -->
            <div class="logo-container">
                <img src="assets/img/mascota.png" alt="TailScan" class="dog-icon">
                <h1 class="title">TailScan</h1>
            </div>

            <h2 class="login-heading">Iniciar Sesión</h2>

            <form action="#" method="post" id="loginForm">
                <div class="input-group">
                    <label for="user">Usuario</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="user" placeholder="Ingresa tu usuario" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                    </div>
                </div>

                <button type="button" class="btn-login" id="btn">
                    <i class="fas fa-paw"></i> Ingresar
                </button>
            </form>

            <div class="footer-links">
                <a href="#">¿Olvidaste tu contraseña?</a>
                <a href="#">¿No tienes cuenta? Regístrate</a>
            </div>
        </div>
    </main>

    <script src="assets/js/logIn.js"></script>
</body>
</html>
