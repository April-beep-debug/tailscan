<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Mascota</title>
    <link rel="stylesheet" href="../assets/css/info.css">
</head>
<body>

    <div class="tarjeta">
        <img id="fotoTarjeta" src="" alt="Foto de la mascota" style="display:none;">
        <div class="info">
            <h1 id="nombreMascota"></h1>

            <p class="telefono" id="telefono"></p>
            <p id="mensajeFoto" style="color:#999; font-size:0.9rem; margin-top:15px;"></p>
        </div>
    </div>

    <script src="../assets/js/info.js"></script>
</body>
</html>
